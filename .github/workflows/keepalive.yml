# Supabase (plan gratis) pausa el proyecto tras 7 días sin actividad: esto hace una consulta dos veces por semana.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 15 * * 1,4' # lunes y jueves, 15:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar la base (cuenta como actividad)
        run: |
          url=$(grep -oP "SUPABASE_URL = '\K[^']+" config.js)
          key=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" config.js)
          curl -fsS "$url/rest/v1/animes?select=id&limit=1" -H "apikey: $key" -o /dev/null -w "Supabase respondió HTTP %{http_code}\n"

      # GitHub apaga los cron de repos sin commits en 60 días; reactivarlo en cada corrida lo evita.
      - name: Mantener activo este cron
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
